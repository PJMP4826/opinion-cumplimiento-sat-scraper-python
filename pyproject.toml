[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opinion-cumplimiento-sat-scraper-python"
version = "0.1.0"
description = "Descarga de la Opinion de Cumplimiento del SAT (32-D) usando e.firma / FIEL."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "PJMP4826" }]
keywords = ["sat", "fiel", "efirma", "32-d", "opinion-de-cumplimiento", "scraper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.28,<1",
    "lxml>=5.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
fiel = ["cryptography>=42"]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opinion_scraper"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/.venv", "/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["bs4.*", "respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "live: pruebas que contactan al SAT real (requieren credenciales y red)",
]
